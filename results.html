<!DOCTYPE html>
<html>
<head>
    <title>EXTRACTED TABLE</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 50px; 
            background-color: #eb9595; 
        }

        .result-container { 
            background: #b79393; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            overflow-x: auto; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            table-layout: auto; width: 100%;;
        }
        th { 
            background-color: #881c1c; 
            color: white; 
            text-align: center; 
            padding: 12px; 
            border: 1px solid #000000;
            white-space: nowrap;
        }
        td { 
            background-color: #f3d0d0; 
            text-align: center; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
        }

        .button-group { 
            margin-top: 20px; 
            display: flex; 
            gap: 15px; 
        }

        .back-btn, .down-btn { 
            display: inline-block; 
            padding: 10px 20px; 
            background-color: #e78f3c;
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover, .down-btn:hover { 
            background-color: #6d3b06;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h2>EXTRACTED TABLE FROM THE TEXT</h2>
        
        <table>
    <thead>
        <tr>
            {% if results %}
                {% for key in results[0].keys() %}
                <th>{{ key.replace('_', ' ') | title }}</th>
                {% endfor %}
            {% endif %}
        </tr>
    </thead>
    <tbody>
        {% for data in results %}
        <tr>
            {% for value in data.values() %}
            <td>{{ value }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>

        <div class="button-group">
            <a href="/" class="back-btn">Process Another File</a>
            <a href="{{ url_for('download_file') }}" class="down-btn">Download CSV</a>
        </div>
    </div>
</body>
</html>
